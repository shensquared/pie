server {
    listen 80;
    listen [::]:80;
    server_name pie.shensquared.noho.st 18.18.54.31 shenshen.mit.edu;
    # server_name _;
    location / {
        return 301 https://$http_host$request_uri;    
    }

    access_log /var/log/nginx/mit-access.log;
    error_log /var/log/nginx/mit-error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pie.shensquared.noho.st 18.18.54.31 shenshen.mit.edu;

    ssl_certificate /etc/yunohost/certs/pie.shensquared.noho.st/crt.pem;
    ssl_certificate_key /etc/yunohost/certs/pie.shensquared.noho.st/key.pem;

    more_set_headers "Strict-Transport-Security : max-age=63072000; includeSubDomains; preload";
    
    # OCSP settings
